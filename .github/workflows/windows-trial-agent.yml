name: Windows Agent 1.1.14

on:
  push:
    branches: [codex/agent-security-1.1.14]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            electron-app
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Build Windows installer for testing
        run: npx electron-builder --win nsis --x64 --publish never '-c.directories.output=dist/windows-ci'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows app
        run: |
          node tests/windows-executable-smoke.cjs 'dist/windows-ci/win-unpacked/ScanItPrintIt Agent.exe' windows-print-results/executable
          if ($LASTEXITCODE -ne 0) { throw "Packaged startup failed: $LASTEXITCODE" }
          $asar = 'dist/windows-ci/win-unpacked/resources/app.asar'
          foreach ($mode in @('render', 'windows-discovery', 'startup', 'order-flow')) {
            & .\node_modules\electron\dist\electron.exe tests/windows-packaged-smoke.cjs $asar $mode windows-print-results/candidate | Out-Default
            if ($LASTEXITCODE -ne 0) { throw "$mode failed: $LASTEXITCODE" }
          }
      - name: Test trial entry and countdown
        run: |
          $asar = 'dist/windows-ci/win-unpacked/resources/app.asar'
          & .\node_modules\electron\dist\electron.exe tests/windows-trial-entry.cjs $asar windows-print-results/trial-dashboard.png | Out-Default
          if ($LASTEXITCODE -ne 0) { throw "Trial entry test failed: $LASTEXITCODE" }
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trial-results
          path: electron-app/windows-print-results
          if-no-files-found: warn
      - name: Verify test installer checksum
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '1.1.14') { throw "Unexpected version $version" }
          $installer = Get-ChildItem 'dist/windows-ci' -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($installer.FullName)))
          if (!(Get-Content 'dist/windows-ci/latest.yml' -Raw).Contains($sha)) { throw 'Installer metadata checksum mismatch' }
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Verified installer SHA-256: $checksum"

      - name: Keep installer for test laptop
        uses: actions/upload-artifact@v4
        with:
          name: ScanItPrintIt-Agent-1.1.14-Windows-test
          path: electron-app/dist/windows-ci/*.exe
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScanItPrintIt-Agent-1.1.14-Windows-test
          path: installer
      - name: Publish tested development installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          source='installer/ScanItPrintIt Agent Setup 1.1.14.exe'
          target='ScanItPrintIt-Agent-Dev-Setup-1.1.14.exe'
          test -s "$source"
          mv "$source" "$target"
          sha256sum "$target" > SHA256SUMS.txt
          tag='dev-agent-1.1.14'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 1
          fi
          gh release create "$tag" "$target" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ScanItPrintIt Agent 1.1.14 Development' --prerelease --latest=false --notes 'Windows development installer with the updated Electron security runtime. This installer is unsigned.'
