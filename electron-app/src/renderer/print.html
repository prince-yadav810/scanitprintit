<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src blob: data:; style-src 'unsafe-inline'; font-src 'self' blob:;">
  <title>ScanItPrintIt document</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: white; }
    .sheet { width: 210mm; height: 297mm; padding: 10mm; display: flex; align-items: center; justify-content: center; break-after: page; overflow: hidden; }
    .sheet:last-child { break-after: auto; }
    .sheet img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
  <script type="module" src="./print-renderer.js"></script>
</head>
<body></body>
</html>
